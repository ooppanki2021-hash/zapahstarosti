<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debug конструктор</title><link rel="stylesheet" href="/style.css?v=7"></head><body>
<div class="container" style="max-width:800px; padding:20px">
<h1>Debug — почему не открывает</h1>
<select id="slug"><option value="chto-takoe-2-nonenal">2-ноненаль</option><option value="kak-otlichit-istochnik-zapakha">Диагностика</option><option value="ubrat-zapah">Тело</option></select>
<button onclick="go()">Открыть</button>
<pre id="log" style="background:#EEF4FF; padding:12px; border-radius:8px; white-space:pre-wrap; margin-top:12px"></pre>
<div id="editor" contenteditable="true" style="border:2px solid #7A9AB8; padding:16px; min-height:300px; margin-top:12px">Тут будет статья</div>
</div>
<script>
async function go(){
  let slug=document.getElementById('slug').value;
  let log=document.getElementById('log');
  log.textContent="Старт: slug="+slug+"\n";
  try{
    let url="/"+slug+"/index.html";
    log.textContent+="Fetch url="+url+"\n";
    let res=await fetch(url);
    log.textContent+="Fetch status="+res.status+" ok="+res.ok+"\n";
    log.textContent+="Headers: "+JSON.stringify([...res.headers.entries()])+"\n";
    let text=await res.text();
    log.textContent+="Получено символов: "+text.length+"\nПервые 200: "+text.substring(0,200)+"\n";
    let parser=new DOMParser();
    let doc=parser.parseFromString(text,"text/html");
    let el=doc.querySelector(".content");
    log.textContent+="querySelector .content найден? "+(!!el)+"\n";
    if(el){
      document.getElementById('editor').innerHTML=el.innerHTML;
      log.textContent+="Вставлено в редактор "+el.innerHTML.length+" симв\n";
    } else {
      document.getElementById('editor').innerHTML=text;
      log.textContent+="Не нашел .content, вставил весь html\n";
    }
  }catch(e){
    log.textContent+="ОШИБКА: "+e.message+"\n"+e.stack;
  }
}
</script>
