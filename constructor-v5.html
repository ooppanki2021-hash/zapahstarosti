<script>
// ===== v7: безопасный localStorage (не убивает скрипт в песочнице) =====
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

(function(){
  let t=lsGet('gh_token'); if(t) document.getElementById('token').value=t;
  document.getElementById('token').addEventListener('change', function(){
    if(document.getElementById('remember').checked){
      lsSet('gh_token', this.value);
      document.getElementById('tokenStatus').textContent="Токен сохранен";
    }
  });
})();

// ===== v7: база для загрузки статей =====
// На сайте (http/https) — относительные пути. С диска (file://) или из превью — грузим прямо с живого сайта.
var SITE='https://zapahstarosti.ru';
var ON_WEB=/^https?:$/.test(location.protocol);
var BASE=ON_WEB ? '' : SITE;

function exec(c,v){
  if(v==='h1') document.execCommand('formatBlock',false,'<h1>');
  else if(v==='h2') document.execCommand('formatBlock',false,'<h2>');
  else if(v==='h3') document.execCommand('formatBlock',false,'<h3>');
  else document.execCommand(c,false,v||null);
}
function addLink(){
  let url=prompt("URL: /kak-ubrat-zapah-s-divana/ или https://...");
  if(!url) return;
  let sel=window.getSelection().toString()||prompt("Текст ссылки:")||url;
  document.execCommand('insertHTML',false, `<a href="${url}">${sel}</a>`);
}
function addAnchor(){
  let id=prompt("ID анкора без пробелов, например pochemu-pahnet");
  if(!id) return;
  document.execCommand('insertHTML',false, `<span id="${id}"></span>`);
}
function addColor(){
  let col=document.getElementById('colorPicker').value;
  document.execCommand('foreColor',false,col);
}
function addTable(){
  document.execCommand('insertHTML',false, `<table class="table-min"><tr><th>Что</th><th>Как</th><th>Чего нельзя</th></tr><tr><td>Кожа</td><td>Мягкое очищение pH 5.5</td><td>Не тереть до скрипа</td></tr></table><p></p>`);
}
function addNote(){
  document.execCommand('insertHTML',false, `<div class="note"><strong>Важное:</strong> Не наносите на кожу уксус, соду, перекись без назначения.</div><p></p>`);
}
function addKstati(){
  document.execCommand('insertHTML',false, `<div class="kstati"><b>Кстати</b>Человек перестает чувствовать свой запах через 20 минут из-за адаптации обоняния.</div><p></p>`);
}
function addButton(){
  let txt=prompt("Текст кнопки:","Найти источник за 10 минут");
  let url=prompt("Ссылка кнопки:","/kak-otlichit-istochnik-zapakha/");
  if(txt&&url) document.execCommand('insertHTML',false, `<p><a href="${url}" style="display:inline-block; padding:10px 18px; border-radius:999px; background:#7A9AB8; color:white; text-decoration:none">${txt}</a></p>`);
}
function addImg(){
  let src=prompt("Путь к картинке, например /images/hero-blue.jpg");

}

let currentSha=null, currentSlug=null, originalHtml=null;

async function load(){
  let slug=document.getElementById('slug').value.trim();
  if(!slug){ alert("Выбери статью"); return; }
  let status=document.getElementById('status');
  status.textContent="Гружу /"+slug+"/index.html ...";
  try{
    // v7: абсолютный адрес если открыто не на сайте + обход кэша GitHub Pages (10 мин)
    let res=await fetch(BASE+"/"+slug+"/index.html?t="+Date.now(), ON_WEB?{cache:'no-store'}:{mode:'cors'});
    if(!res.ok) throw new Error("HTTP "+res.status);
    let html=await res.text();
    let parser=new DOMParser();
    let doc=parser.parseFromString(html,"text/html");
    let contentEl=doc.querySelector(".content");
    if(!contentEl) throw new Error("В странице нет блока .content");
    document.getElementById('editor').innerHTML=contentEl.innerHTML;
    // v7: разбор через DOMParser — надежнее регексов
    let tEl=doc.querySelector("title"); if(tEl) document.getElementById('title').value=tEl.textContent.trim();
    let dEl=doc.querySelector('meta[name="description"]'); if(dEl) document.getElementById('desc').value=dEl.getAttribute("content")||'';
    let h1El=doc.querySelector(".content h1")||doc.querySelector("h1");
    if(h1El) document.getElementById('h1').value=h1El.textContent.trim();
    // v7: галочка noindex отражает реальное состояние страницы
    let robots=doc.querySelector('meta[name="robots"]');
    document.getElementById('noindexBox').checked = !!(robots && /noindex/i.test(robots.getAttribute("content")||''));
    originalHtml=html; currentSlug=slug; currentSha=null;
    status.textContent="✅ Открыто: "+slug+" — "+contentEl.innerHTML.length+" симв. Можно править и копировать."+(ON_WEB?"":" (гружу с живого сайта — ты открыла конструктор не на zapahstarosti.ru)");
    // получить sha для сохранения если токен есть
    let owner=document.getElementById('owner').value.trim();
    let repo=document.getElementById('repo').value.trim();
    let branch=document.getElementById('branch').value.trim()||'main';
    let token=document.getElementById('token').value.trim();
    if(token){
      try{
        let apiRes=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${slug}/index.html?ref=${branch}`,{headers:{Authorization:`token ${token}`}});
        if(apiRes.ok){ let d=await apiRes.json(); currentSha=d.sha; }
      }catch(e){}
    }
  }catch(e){
    document.getElementById('status').textContent="Ошибка: "+e.message+(ON_WEB?"":"\nОткрыто не на сайте — статью беру с https://zapahstarosti.ru. Если не вышло, проверь интернет или открой конструктор на сайте.");
  }
}

// ===== v7: главное исправление сохранения =====
// Существующая страница НЕ пересобирается по шаблону: правки вшиваются в её собственный
// HTML. Меню, favicon, метрика, верификация и noindex остаются ровно как были.
function buildFromOriginal(slug){
  let parser=new DOMParser();
  let doc=parser.parseFromString(originalHtml,"text/html");
  let title=document.getElementById('title').value.trim();
  let desc=document.getElementById('desc').value.trim();
  let h1v=document.getElementById('h1').value.trim();
  if(title){ let t=doc.querySelector("title"); if(t) t.textContent=title; }
  if(desc){ let m=doc.querySelector('meta[name="description"]'); if(m) m.setAttribute("content",desc); }
  let canon=doc.querySelector('link[rel="canonical"]');
  if(canon) canon.setAttribute("href",`https://zapahstarosti.ru/${slug}/`);
  let content=doc.querySelector(".content");
  if(!content) throw new Error("В исходной странице нет .content");
  content.innerHTML=document.getElementById('editor').innerHTML;
  let h1=content.querySelector("h1");
  if(h1 && h1v) h1.innerHTML=h1v;
  // noindex по галочке
  let robots=doc.querySelector('meta[name="robots"]');
  if(document.getElementById('noindexBox').checked){
    if(!robots){ robots=doc.createElement("meta"); robots.setAttribute("name","robots"); doc.head.appendChild(robots); }
    robots.setAttribute("content","noindex, nofollow");
  } else if(robots){ robots.remove(); }
  return "<!DOCTYPE html>\n"+doc.documentElement.outerHTML;
}

function buildNewPage(slug){
  let title=document.getElementById('title').value||'Новая статья';
  let desc=document.getElementById('desc').value||'';
  let h1=document.getElementById('h1').value||title;
  let body=document.getElementById('editor').innerHTML;
  // v7: если в теле уже есть h1 (например, при копировании страницы) — не добавляем второй
  if(!/<h1[\s>]/i.test(body)) body='<h1>'+h1+'</h1>\n'+body;
  let today=new Date().toLocaleDateString('ru-RU');
  let robotsLine=document.getElementById('noindexBox').checked?'\n<meta name="robots" content="noindex, nofollow">':'';
  return `<!DOCTYPE html><html lang="ru"><head>

function buildHtml(slug){
  if(originalHtml && currentSlug===slug) return buildFromOriginal(slug);
  if(originalHtml) return buildFromOriginal(slug); // копия в новый slug — тоже на базе оригинала
  return buildNewPage(slug);
}

async function save(){
  let owner=document.getElementById('owner').value.trim();
  let repo=document.getElementById('repo').value.trim();
  let branch=document.getElementById('branch').value.trim()||'main';
  let token=document.getElementById('token').value.trim();
  let slug=currentSlug||document.getElementById('slug').value;
  if(!token||!slug){ alert("Нужен токен и открытая статья"); return; }
  let full;
  try{ full=buildHtml(slug); }
  catch(e){ document.getElementById('status').textContent="Ошибка сборки: "+e.message; return; }
  let b64=btoa(unescape(encodeURIComponent(full)));
  document.getElementById('status').textContent="Сохраняю "+slug+"...";
  try{
    if(!currentSha){
      let r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${slug}/index.html?ref=${branch}`,{headers:{Authorization:`token ${token}`}});
      if(r.ok){ let d=await r.json(); currentSha=d.sha; }
    }
    let body={message:`update ${slug} via constructor v7`, content:b64, branch:branch};
    if(currentSha) body.sha=currentSha;
    let res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${slug}/index.html`,{method:"PUT", headers:{Authorization:`token ${token}`, "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(!res.ok) throw new Error(await res.text());
    let data=await res.json();
    currentSha=data.content.sha;
    originalHtml=full; // v7: дальше правим уже сохраненную версию
    document.getElementById('status').textContent="✅ Сохранено! https://zapahstarosti.ru/"+slug+"/ (кэш GitHub до 10 минут)"+(document.getElementById('noindexBox').checked?" • страница СКРЫТА noindex":" • страница ОТКРЫТА для индексации");
  }catch(e){ document.getElementById('status').textContent="Ошибка: "+e.message; }
}

async function copyPage(){
  let owner=document.getElementById('owner').value.trim();
  let repo=document.getElementById('repo').value.trim();
  let branch=document.getElementById('branch').value.trim()||'main';
  let token=document.getElementById('token').value.trim();
  if(!token){ alert("Нужен токен для копирования"); return; }
  let newSlug=document.getElementById('newSlug').value.trim() || prompt("Новый slug для копии, например: kak-ubrat-zapah-iz-obuvi");
  if(!newSlug) return;
  // v7: новая страница по умолчанию скрыта noindex — спросим, если вдруг хотят открыть сразу
  if(!document.getElementById('noindexBox').checked){
    if(!confirm("Сейчас галочка noindex СНЯТА — новая страница сразу попадет в индекс.\n\nОК = создать открытой.\nОтмена = создать скрытой noindex (рекомендую, публикация по плану).")){
      document.getElementById('noindexBox').checked=true;
    }
  }
  let full;
  try{ full=buildHtml(newSlug); }
  catch(e){ document.getElementById('status').textContent="Ошибка сборки: "+e.message; return; }
  let b64=btoa(unescape(encodeURIComponent(full)));
  document.getElementById('status').textContent="Копирую в "+newSlug+"...";
  try{
    // v7: если страница уже существует — спросим и возьмем sha (раньше было ошибкой 422)
    let ex=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${newSlug}/index.html?ref=${branch}`,{headers:{Authorization:`token ${token}`}});
    let sha=null;
    if(ex.ok){
      let d=await ex.json(); sha=d.sha;
      if(!confirm("/"+newSlug+"/ уже существует. Перезаписать?")){ document.getElementById('status').textContent="Отменено."; return; }
    }
    let body={message:`copy ${currentSlug||''} to ${newSlug} via constructor v7`, content:b64, branch:branch};
    if(sha) body.sha=sha;
    let res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${newSlug}/index.html`,{
      method:"PUT",
      headers:{Authorization:`token ${token}`, "Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    if(!res.ok) throw new Error(await res.text());
    document.getElementById('status').textContent="✅ Скопировано! Новая страница: https://zapahstarosti.ru/"+newSlug+"/ — добавь ее в меню и sitemap.xml"+(document.getElementById('noindexBox').checked?" • создана СКРЫТОЙ noindex":"");
  }catch(e){ document.getElementById('status').textContent="Ошибка копирования: "+e.message; }
}

function download(){
  let slug=document.getElementById('newSlug').value.trim()||currentSlug||document.getElementById('slug').value||'novaya';
  let full;
  try{ full=buildHtml(slug); }
  catch(e){ document.getElementById('status').textContent="Ошибка сборки: "+e.message; return; }
  let blob=new Blob([full],{type:'text/html'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='index.html'; a.click();
}
</script>
