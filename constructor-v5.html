<!DOCTYPE html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор — финальный рабочий — все 26 статей</title>
<style>
body{font-family:system-ui, sans-serif; background:#F6F9FF; padding:20px; max-width:800px; margin:0 auto}
.box{background:white; border:1px solid #DCE8F5; border-radius:12px; padding:14px; margin:10px 0}
#editor{border:2px solid #7A9AB8; border-radius:12px; padding:16px; min-height:400px; background:white}
select, input{width:100%; padding:10px; border:1px solid #DCE8F5; border-radius:8px; margin:4px 0}
button{padding:10px 18px; border-radius:999px; border:0; background:#5A7A9A; color:white; cursor:pointer}
#status{margin-top:10px; font-weight:bold; color:#5A7A9A; white-space:pre-wrap}
</style>
</head><body>
<h1>Конструктор — финальный — все 26 статей</h1>
<div class="box">
<select id="slug">
<option value="chto-takoe-2-nonenal">2-ноненаль — наука</option>
<option value="kak-otlichit-istochnik-zapakha">Диагностика — где источник</option>
<option value="ubrat-zapah">Тело — как уменьшить запах</option>
<option value="zapah-v-kvartire">Квартира — общая карта</option>
<option value="kak-ubrat-zapah-s-divana">Квартира — Диван</option>
<option value="kak-ubrat-zapah-s-matrasa">Квартира — Матрас</option>
<option value="kak-ubrat-zapah-iz-shkafa">Квартира — Шкаф</option>
<option value="kak-ubrat-zapah-v-stiralnoj-mashine">Квартира — Стиралка</option>
<option value="kak-ubrat-zapah-v-sanuzle">Квартира — Санузел</option>
<option value="ventilyatsiya-i-vlazhnost">Квартира — Вентиляция</option>
<option value="karta-kvartiry">Квартира — Карта квартиры</option>
<option value="odezhda-i-tekstil">Тело — Одежда и текстиль</option>
<option value="uhod-za-suhoj-kozhej">Тело — Сухая кожа</option>
<option value="lekarstva-i-zapah">Тело — Лекарства</option>
<option value="kogda-k-vrachu">Тело — Когда к врачу</option>
<option value="kak-pogovorit-s-blizkim">Тело — Как поговорить с близким</option>
<option value="sredstva-ot-zapaha">Средства — что нейтрализует</option>
<option value="poroshok-dlya-tekstila">Средства — Порошок</option>
<option value="tonik-protirka">Средства — Тоник</option>
<option value="nabor">Средства — Набор</option>
<option value="ochistitel-vozduha">Средства — Очиститель воздуха</option>
<option value="karta-osetii">Карта Осетии</option>
<option value="kviz">Квиз</option>
<option value="material-metod">Таблица материал-метод</option>
<option value="faq">FAQ</option>
<option value="o-proekte">О проекте</option>
</select>
<button onclick="load()">Открыть статью</button>
<div id="status">Жду клика</div>
</div>
<div class="box"><div id="editor" contenteditable="true">Тут появится статья</div></div>

<script>
async function load(){
  let slug=document.getElementById('slug').value;
  let status=document.getElementById('status');
  status.textContent="Гружу /"+slug+"/index.html ...";
  try{
    let res=await fetch("/"+slug+"/index.html");
    status.textContent="Статус ответа: "+res.status;
    let html=await res.text();
    let parser=new DOMParser();
    let doc=parser.parseFromString(html,"text/html");
    let content=doc.querySelector(".content");
    if(!content) throw new Error("Не нашел .content в "+slug);
    document.getElementById('editor').innerHTML=content.innerHTML;
    status.textContent="✅ Загружено: "+html.length+" симв, в редакторе "+content.innerHTML.length+" симв — можно редактировать";
  }catch(e){
    document.getElementById('status').textContent="Ошибка: "+e.message;
  }
}
</script>
</body></html>
